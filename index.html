      <div class="tlist" id="tlist">
        <div style="font-family:VT323,monospace;font-size:14px;color:#220808;padding:10px;text-align:center;letter-spacing:2px;">SELECIONE UMA PLAYLIST</div>
      </div>
    </div>
  </div>
</div>

<script>
let isLight=false;
function toggleBg(){
  isLight=!isLight;
  const b=document.getElementById("body"),label=document.getElementById("settingsTheme");
  if(isLight){b.style.background="#EDEDED";b.classList.add("light");label.textContent="LIGHT";}
  else{b.style.background="#151515";b.classList.remove("light");label.textContent="DARK";}
}

function toggleSettings(){const menu=document.getElementById("settingsMenu"),trigger=menu.querySelector(".settings-trigger"),open=menu.classList.toggle("open");trigger.setAttribute("aria-expanded",String(open));}
function openSpotifyControl(){if(!token){connectSpotify();return;}toggleLibrary(false);document.getElementById("plPanel").scrollIntoView({behavior:"smooth",block:"center"});}
function setAccent(color){
  document.body.dataset.accent=color;
  localStorage.setItem("radiocar-accent",color);
  document.querySelectorAll(".accent-dot").forEach(dot=>dot.classList.toggle("selected",dot.classList.contains(color)));
  document.getElementById("settingsMenu").classList.remove("open");
  document.querySelector(".settings-trigger").setAttribute("aria-expanded","false");
}
setAccent(localStorage.getItem("radiocar-accent")||"red");

function stopScreenAnimation(){
  const screen=document.querySelector(".lcd"),video=document.querySelector(".lcd-video");
  if(!screen||screen.classList.contains("screen-active"))return;
  screen.classList.add("screen-active");
  if(video)video.pause();
}
function toggleScreenAnimation(){
  const screen=document.querySelector(".lcd"),video=document.querySelector(".lcd-video");
  if(!screen||!video)return;
  if(screen.classList.contains("screen-active")){
    screen.classList.remove("screen-active");
    video.currentTime=0;
    video.play().catch(()=>{});
  }else stopScreenAnimation();
}

// Knob rotation: 0-100 → -135° to +135°
function rotateKnob(val){
  document.getElementById("knobImg").style.transform=`rotate(${(val/100)*270-135}deg)`;
}
rotateKnob(70);

function doFlash(btn){
  const el=document.getElementById("flash"),wr=document.getElementById("rw").getBoundingClientRect();
  const br=btn.getBoundingClientRect();
  const fw=br.width*1.6,fh=br.height*1.6;
  el.style.cssText=`width:${fw}px;height:${fh}px;left:${br.left-wr.left+(br.width-fw)/2}px;top:${br.top-wr.top+(br.height-fh)/2}px;border-radius:${Math.min(fw,fh)*0.3}px;`;
  el.classList.remove("fire");void el.offsetWidth;el.classList.add("fire");
}

const SPOTIFY_CLIENT_ID="bb679e6ebdea4e0a864c689e7ce93737";
const REDIRECT=location.hostname.endsWith(".github.io")?location.origin+location.pathname.replace(/\/$/,""):location.href.split("?")[0].split("#")[0];
const SCOPES="streaming user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private";
let token=null,player=null,deviceId=null,dur=0,pos=0,isPlaying=false,shuffle=false,repeat=false,plId=null,tracks=[],poll=null,playerBooted=false,poweredOff=false,volumeUiTimer=null;

const params=new URLSearchParams(location.search);
const savedToken=localStorage.getItem("rc_tok");
if(params.get("code")) exchangeCode(params.get("code"));
else if(params.get("error")) showAuthError("Conexão cancelada no Spotify.");
else if(savedToken){token=savedToken;verify();}

function showAuthError(message){const e=document.getElementById("authErr");if(e)e.textContent=message;}
function randomString(length=64){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";const values=crypto.getRandomValues(new Uint8Array(length));return [...values].map(v=>chars[v%chars.length]).join("");}
async function challengeFor(verifier){const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");}
async function exchangeCode(code){
  const verifier=localStorage.getItem("rc_verifier"),cid=localStorage.getItem("rc_cid");
  if(!verifier||!cid){showAuthError("Sessão de conexão expirou. Tente novamente.");return;}
  try{const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:cid,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:verifier})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||"Não foi possível concluir a conexão.");token=d.access_token;localStorage.setItem("rc_tok",token);if(d.refresh_token)localStorage.setItem("rc_refresh",d.refresh_token);history.replaceState({},document.title,REDIRECT);bootSDK();showMain();}catch(err){showAuthError(err.message);}
}
async function refreshToken(){const refresh=localStorage.getItem("rc_refresh"),cid=localStorage.getItem("rc_cid");if(!refresh||!cid)return false;try{const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:cid,grant_type:"refresh_token",refresh_token:refresh})});const d=await r.json();if(!r.ok)throw new Error();token=d.access_token;localStorage.setItem("rc_tok",token);if(d.refresh_token)localStorage.setItem("rc_refresh",d.refresh_token);return true;}catch{return false;}}
async function verify(){const r=await api("/me");if(r&&r.ok){bootSDK();showMain();}else if(await refreshToken()){bootSDK();showMain();}else disconnect();}
async function api(path,options={}){const headers={...(options.headers||{}),Authorization:"Bearer "+token};let r=await fetch("https://api.spotify.com/v1"+path,{...options,headers}).catch(()=>null);if(r&&r.status===401&&await refreshToken()){headers.Authorization="Bearer "+token;r=await fetch("https://api.spotify.com/v1"+path,{...options,headers}).catch(()=>null);}return r;}
async function connectSpotify(){
  const cid=SPOTIFY_CLIENT_ID;
  if(location.protocol==="file:"){showAuthError("Abra o RadioCar em http://127.0.0.1:5173/ para conectar o Spotify.");return;}
  localStorage.setItem("rc_cid",cid);const verifier=randomString();localStorage.setItem("rc_verifier",verifier);const auth=new URL("https://accounts.spotify.com/authorize");auth.search=new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:await challengeFor(verifier)});location.assign(auth);
}
function toggleLibrary(force){const main=document.getElementById("mainBlock"),button=document.getElementById("panelToggle"),panel=document.getElementById("plPanel");const hide=typeof force==="boolean"?force:main.style.display!=="none";main.style.display=hide?"none":"block";panel.classList.toggle("is-collapsed",hide);button.textContent=hide?"MOSTRAR LISTAS":"OCULTAR LISTAS";button.setAttribute("aria-expanded",String(!hide));}
function disconnect(){token=null;localStorage.removeItem("rc_tok");localStorage.removeItem("rc_refresh");if(player){player.disconnect();player=null;}playerBooted=false;clearInterval(poll);setDisp("- - - - - - - -","PRESSIONE SPOTIFY",0,0);setStatus(false,"OFFLINE");document.getElementById("authBlock").style.display="block";document.getElementById("mainBlock").style.display="none";document.getElementById("panelToolbar").style.display="none";document.getElementById("plPanel").classList.add("auth-mode");}
function showMain(){document.getElementById("authBlock").style.display="none";document.getElementById("panelToolbar").style.display="flex";document.getElementById("plPanel").classList.remove("auth-mode");toggleLibrary(false);setStatus(false,"CONECTADO");loadPlaylists();startPoll();}
function bootSDK(){if(!token||playerBooted)return;playerBooted=true;const s=document.createElement("script");s.src="https://sdk.scdn.co/spotify-player.js";document.body.appendChild(s);}
window.onSpotifyWebPlaybackSDKReady=()=>{
  player=new Spotify.Player({name:"RadioCar",volume:0.7,getOAuthToken:cb=>cb(token)});
  player.addListener("ready",({device_id})=>{deviceId=device_id;api("/me/player",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({device_ids:[device_id],play:false})});document.getElementById("iBT").classList.add("on");});
  player.addListener("authentication_error",()=>showAuthError("A sessão expirou. Conecte novamente."));
  player.addListener("account_error",()=>showAuthError("A reprodução no navegador exige Spotify Premium."));
  player.addListener("player_state_changed",s=>{if(!s)return;const t=s.track_window.current_track;isPlaying=!s.paused;dur=s.duration;pos=s.position;shuffle=s.shuffle;setDisp(t.name,t.artists.map(a=>a.name).join(" / "),s.position,s.duration);setStatus(isPlaying,isPlaying?"PLAYING":"PAUSE");updIco();hiTrack(t.uri);});
  player.connect();
};
function requireConnection(){if(token)return true;showAuthError("CONECTE O SPOTIFY PARA USAR ESTE CONTROLE.");return false;}
async function togglePower(){poweredOff=!poweredOff;const radio=document.getElementById("rw");radio.classList.toggle("is-powered-off",poweredOff);if(poweredOff){if(player)await player.pause();else if(token)await api("/me/player/pause",{method:"PUT"});setStatus(false,"DESLIGADO");return;}setStatus(false,token?"CONECTADO":"OFFLINE");if(token){const state=await getState();if(state?.item)setDisp(state.item.name,state.item.artists.map(a=>a.name).join(" / "),state.progress_ms,state.item.duration_ms);}}
async function togglePlay(){if(poweredOff){await togglePower();return;}if(!requireConnection())return;if(player){player.togglePlay();return;}const s=await getState();await api(`/me/player/${s?.is_playing?"pause":"play"}`,{method:"PUT"});}
async function prevTrack(){if(poweredOff||!requireConnection())return;if(player){player.previousTrack();return;}await api("/me/player/previous",{method:"POST"});}
async function nextTrack(){if(poweredOff||!requireConnection())return;if(player){player.nextTrack();return;}await api("/me/player/next",{method:"POST"});}
function showVolumeUi(){const lcd=document.querySelector(".lcd");lcd.classList.add("volume-active");clearTimeout(volumeUiTimer);volumeUiTimer=setTimeout(()=>lcd.classList.remove("volume-active"),1800);}
function onVol(v){if(poweredOff)return;v=Math.round(Number(v));rotateKnob(v);document.getElementById("volFill").style.width=v+"%";document.getElementById("volNum").textContent=v;showVolumeUi();if(player){player.setVolume(v/100);return;}if(requireConnection())api(`/me/player/volume?volume_percent=${v}`,{method:"PUT"});}
async function toggleShuffle(){if(poweredOff||!requireConnection())return;shuffle=!shuffle;updIco();await api(`/me/player/shuffle?state=${shuffle}`,{method:"PUT"});}
async function toggleRepeat(){if(poweredOff||!requireConnection())return;repeat=!repeat;updIco();await api(`/me/player/repeat?state=${repeat?"track":"off"}`,{method:"PUT"});}
async function seekTo(e){if(poweredOff||!requireConnection()||!dur)return;const r=e.currentTarget.getBoundingClientRect();const ms=Math.floor(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*dur);if(player){player.seek(ms);return;}await api(`/me/player/seek?position_ms=${ms}`,{method:"PUT"});}
function showInfo(){
  if(poweredOff)return;
  const title=document.getElementById("lcdTitle"),artist=document.getElementById("lcdArtist"),label=document.getElementById("lcdLbl");
  const previous={title:title.textContent,titleClass:title.className,artist:artist.textContent,label:label.textContent};
  const credit="RadioCar create by @mateusfrmacedo";
  label.textContent="INFO";
  title.textContent=`${credit}       ${credit}`;
  title.className="title scroll";
  artist.textContent="";
  setTimeout(()=>{title.textContent=previous.title;title.className=previous.titleClass;artist.textContent=previous.artist;label.textContent=previous.label;},3600);
}
function showUsbInfo(){const el=document.getElementById("lcdArtist"),o=el.textContent;el.textContent="USB: USE O SPOTIFY";setTimeout(()=>el.textContent=o,2200);}
function shareTrack(){const t=document.getElementById("lcdTitle").textContent,a=document.getElementById("lcdArtist").textContent;if(!t.startsWith("-")&&navigator.clipboard){navigator.clipboard.writeText(t+" - "+a);const el=document.getElementById("lcdLbl"),o=el.textContent;el.textContent="COPIADO";setTimeout(()=>el.textContent=o,2000);}}
async function loadPlaylists(){if(!token)return;const r=await api("/me/playlists?limit=50");const row=document.getElementById("chips");if(!r||!r.ok){row.innerHTML='<div class="system-msg">NÃO FOI POSSÍVEL LER AS PLAYLISTS</div>';return;}const d=await r.json();row.innerHTML="";(d.items||[]).forEach(pl=>{const c=document.createElement("button");c.className="chip";c.textContent=pl.name;c.type="button";c.onclick=()=>loadTracks(pl.id,pl.name,c);row.appendChild(c);});if(!d.items?.length)row.innerHTML='<div class="system-msg">NENHUMA PLAYLIST DISPONÍVEL</div>';}
async function loadTracks(id,name,chip){
  plId=id;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  chip.classList.add("on");
  document.getElementById("plName").textContent=name;
  document.getElementById("tlist").innerHTML='<div class="system-msg">SINTONIZANDO...</div>';
  const allItems=[];
  let offset=0;
  while(true){
    const r=await api(`/playlists/${id}/items?limit=50&offset=${offset}`);
    if(!r||!r.ok){document.getElementById("tlist").innerHTML='<div class="system-msg">FAIXAS INDISPONÍVEIS NESTA PLAYLIST</div>';return;}
    const page=await r.json();
    const items=page.items||[];
    allItems.push(...items);
    if(!page.next||!items.length)break;
    offset+=items.length;
  }
  tracks=allItems.map(i=>i.item).filter(t=>t&&t.type==="track");
  renderTracks();
}
function renderTracks(){const list=document.getElementById("tlist");list.innerHTML="";if(!tracks.length){list.innerHTML='<div class="system-msg">SEM FAIXAS PARA TOCAR</div>';return;}tracks.forEach((t,i)=>{const el=document.createElement("div");el.className="trow";el.dataset.uri=t.uri;el.innerHTML=`<div class="tidx"><span class="tidx-n">${i+1}</span><div class="teq"><div class="teb" style="height:3px"></div><div class="teb" style="height:7px"></div><div class="teb" style="height:2px"></div></div></div><div class="tinfo"><div class="tn"></div><div class="ta"></div></div><div class="td">${ms2t(t.duration_ms)}</div>`;el.querySelector(".tn").textContent=t.name;el.querySelector(".ta").textContent=t.artists.map(a=>a.name).join(", ");el.onclick=()=>playTrack(t.uri,i);list.appendChild(el);});}
async function playTrack(uri,idx){if(!token)return;const body=plId?{context_uri:`spotify:playlist:${plId}`,offset:{position:idx}}:{uris:[uri]};const dev=deviceId?`?device_id=${deviceId}`:"";const r=await api(`/me/player/play${dev}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r&&!r.ok)showAuthError("Não foi possível iniciar a reprodução neste dispositivo.");}
function setDisp(title,artist,p,d){const el=document.getElementById("lcdTitle"),artistLine=document.getElementById("lcdArtist"),isTrack=title!=="- - - - - - - -";const marquee=isTrack?`${title}     -     ${artist}`:title;el.textContent=isTrack?marquee+"       "+marquee:marquee;el.className="title"+(isTrack?" scroll":"");artistLine.textContent=isTrack?"":artist.toUpperCase();document.getElementById("tCur").textContent=ms2t(p);document.getElementById("tTot").textContent=ms2t(d);dur=d;pos=p;updProg();}
function updProg(){if(!dur)return;document.getElementById("progFill").style.width=(pos/dur*100)+"%";}
function setStatus(on,txt){document.getElementById("led").className="led"+(on?"":" off");document.getElementById("lcdLbl").textContent=txt;isPlaying=on;}
function updIco(){const sh=document.getElementById("iShuffle"),rp=document.getElementById("iRepeat");sh.className="ico lcd-mode-icon"+(shuffle?" on":"");rp.className="ico lcd-mode-icon"+(repeat?" on":"");sh.setAttribute("aria-label",shuffle?"Shuffle ativado":"Shuffle desativado");rp.setAttribute("aria-label",repeat?"Repetição ativada":"Repetição desativada");}
function hiTrack(uri){document.querySelectorAll(".trow").forEach(el=>el.classList.toggle("on",el.dataset.uri===uri));}
async function getState(){if(!token)return null;const r=await api("/me/player");if(!r||r.status===204||!r.ok)return null;return r.json();}
function startPoll(){clearInterval(poll);poll=setInterval(async()=>{if(player){if(isPlaying){pos+=1000;updProg();document.getElementById("tCur").textContent=ms2t(pos);}return;}const s=await getState();if(!s||!s.item)return;isPlaying=s.is_playing;dur=s.item.duration_ms;pos=s.progress_ms;setDisp(s.item.name,s.item.artists.map(a=>a.name).join(" / "),s.progress_ms,s.item.duration_ms);setStatus(s.is_playing,s.is_playing?"PLAYING":"PAUSE");hiTrack(s.item.uri);shuffle=s.shuffle_state;updIco();if(isPlaying)pos+=1000;},1000);}
function ms2t(ms){if(!ms)return"0:00";const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
document.getElementById("knobOvr").addEventListener("wheel",e=>{e.preventDefault();const inp=document.getElementById("volRange");inp.value=Math.max(0,Math.min(100,+inp.value-Math.sign(e.deltaY)*6));onVol(inp.value);},{passive:false});
const knob=document.getElementById("knobOvr"),volumeInput=document.getElementById("volRange");
let knobDrag=null;
knob.addEventListener("pointerdown",event=>{if(poweredOff)return;knobDrag={id:event.pointerId,y:event.clientY,value:+volumeInput.value};knob.setPointerCapture(event.pointerId);});
knob.addEventListener("pointermove",event=>{if(!knobDrag||event.pointerId!==knobDrag.id)return;const value=Math.max(0,Math.min(100,knobDrag.value-(event.clientY-knobDrag.y)*1.1));volumeInput.value=value;onVol(value);});
["pointerup","pointercancel"].forEach(type=>knob.addEventListener(type,event=>{if(knobDrag?.id===event.pointerId)knobDrag=null;}));
document.querySelectorAll(".ovr").forEach(control=>{
  control.addEventListener("pointerdown",()=>{if(!control.classList.contains("o-brand"))stopScreenAnimation();control.classList.add("is-pressed");if(navigator.vibrate)navigator.vibrate(8);});
  ["pointerup","pointercancel","pointerleave"].forEach(type=>control.addEventListener(type,()=>control.classList.remove("is-pressed")));
});
function openLibrary(){if(token)toggleLibrary(false);document.getElementById("plPanel").scrollIntoView({behavior:"smooth",block:"center"});}
document.querySelector(".o-spt").addEventListener("click",openSpotifyControl);
document.querySelector(".o-menu").addEventListener("click",openLibrary);
Object.entries({".o-play":"Tocar ou pausar",".o-power":"Ligar ou desligar",".o-menu":"Abrir playlists",".o-spt":"Conectar Spotify",".o-back":"Faixa anterior",".o-b1":"Faixa anterior",".o-b2":"Próxima faixa",".o-b3":"Alternar aleatório",".o-b4":"Alternar repetição",".o-b5":"Informações da faixa",".o-b6":"Copiar informações da faixa",".o-usb":"Informações da entrada USB",".o-brand":"Alternar animação da tela"}).forEach(([selector,label])=>document.querySelector(selector).setAttribute("aria-label",label));
document.addEventListener("pointerdown",event=>{if(event.target.closest(".o-brand"))return;if(event.target.closest("button, input, .r4, .trow"))stopScreenAnimation();});
</script>
</body>
</html>
